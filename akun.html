<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola Akun — B&B Petshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #fbf1e6; --surface: #ffffff; --surface-sunken: #f7e8d6;
    --ink: #2b1d14; --ink-dim: #8a7062; --line: #ecdcc4;
    --accent: #c96a2e; --accent-ink: #ffffff; --accent-soft: #fbe3ce;
    --ok-ink: #1c6b3c; --ok-bg: #e3f3e6; --err-ink: #af2a1e; --err-bg: #fbe8e4;
    --warn-ink: #8a5a00; --warn-bg: #fbeecb;
    --focus-ring: #c96a2e;
    --shadow: 0 1px 2px rgba(60,35,15,.06), 0 6px 20px rgba(60,35,15,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1c140e; --surface: #241a12; --surface-sunken: #2c2016;
      --ink: #f5e8da; --ink-dim: #b89c87; --line: #3d2c1e;
      --accent: #e8925a; --accent-ink: #1c140e; --accent-soft: #3d2416;
      --ok-ink: #7fd39a; --ok-bg: #17301f; --err-ink: #f0958a; --err-bg: #3a1f1b;
      --warn-ink: #e3b657; --warn-bg: #3a2f10;
      --focus-ring: #e8925a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45; padding: 16px 14px 100px;
    max-width: 560px; margin-left: auto; margin-right: auto;
  }
  .kode-mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  header.app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .header-user { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 38px; height: 38px; border-radius: 13px; background: linear-gradient(155deg, var(--accent), #e08a52); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex: none;
    font-family: "Baloo 2", sans-serif; box-shadow: 0 3px 8px rgba(201,106,46,.25);
  }
  .header-user .info { min-width: 0; }
  .header-user .info h1 { font-family: "Baloo 2", sans-serif; font-size: 15px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-pill {
    display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 999px; margin-top: 2px;
  }
  .btn-logout {
    background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 12px;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; padding: 0; flex: none;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-dim); text-decoration: none; margin-bottom: 14px;
  }

  section.card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-dim); margin: 0 0 12px; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin: 12px 0 5px; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%; padding: 11px 12px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface-sunken); color: var(--ink);
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  button { font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 12px; border: none; border-radius: 13px; cursor: pointer; width: 100%; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #e08a52); color: var(--accent-ink); margin-top: 14px; box-shadow: 0 4px 12px rgba(201,106,46,.22); }

  #status { margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; display: none; font-weight: 600; }
  .ok { background: var(--ok-bg); color: var(--ok-ink); display: block !important; }
  .error { background: var(--err-bg); color: var(--err-ink); display: block !important; }

  .akun-item { border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-bottom: 10px; }
  .akun-item .baris-atas { display: flex; align-items: center; gap: 10px; }
  .akun-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--surface-sunken); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none;
  }
  .akun-item .nama-baris { font-weight: 700; font-size: 14px; }
  .akun-item .username-baris { font-size: 12px; color: var(--ink-dim); font-family: "IBM Plex Mono", monospace; }
  .badge-row { display: flex; gap: 6px; margin-left: auto; }
  .badge { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; }
  .badge-admin { background: var(--accent-soft); color: var(--accent); }
  .badge-kasir { background: #e0ecfb; color: #2d5f9e; }
  .badge-gudang { background: #e5f0e0; color: #4a7a2e; }
  .badge-aktif { background: var(--ok-bg); color: var(--ok-ink); }
  .badge-nonaktif { background: var(--err-bg); color: var(--err-ink); }
  .role-select {
    padding: 8px 10px; font-size: 12.5px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-sunken); color: var(--ink); flex: 1; margin-top: 0;
  }

  .akun-aksi { display: flex; gap: 6px; margin-top: 10px; }
  .akun-aksi button { flex: 1; padding: 8px; font-size: 11.5px; margin-top: 0; border-radius: 7px; background: var(--surface-sunken); color: var(--ink); }
  .akun-aksi button.danger { background: var(--err-bg); color: var(--err-ink); }
  .akun-aksi button.ok { background: var(--ok-bg); color: var(--ok-ink); }

  .empty-hint { color: var(--ink-dim); font-size: 13px; text-align: center; padding: 14px 0; }

  nav.bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); display: flex;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 12px rgba(60,35,15,.06); z-index: 100;
  }
  nav.bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; text-decoration: none; color: var(--ink-dim); border-radius: 14px; margin: 0 2px;
    transition: background .12s ease, color .12s ease;
  }
  nav.bottom-nav a .ic { font-size: 19px; }
  nav.bottom-nav a .lbl { font-size: 9px; font-weight: 700; }
  nav.bottom-nav a.active { color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-user">
    <div class="avatar" id="headerAvatar">?</div>
    <div class="info">
      <h1 id="headerNama">Memuat…</h1>
      <span class="role-pill" id="headerRole">-</span>
    </div>
  </div>
  <button type="button" class="btn-logout" onclick="prosesLogout()" title="Logout">🚪</button>
</header>

<a class="back-link" href="index.html">← Kembali ke Menu</a>

<section class="card">
  <p class="card-label">Buat Akun Baru</p>
  <label for="newUsername">Username</label>
  <input type="text" id="newUsername" class="kode-mono" placeholder="mis. indah" autocapitalize="off">
  <label for="newPassword">Password</label>
  <input type="text" id="newPassword" class="kode-mono" placeholder="Minimal 6 karakter">
  <label for="newNama">Nama</label>
  <input type="text" id="newNama" placeholder="mis. Indah">
  <label for="newRole">Role</label>
  <select id="newRole">
    <option value="Kasir">Kasir — hanya akses menu Kasir</option>
    <option value="Gudang">Gudang — hanya akses menu Stok</option>
    <option value="Admin">Admin — akses semua menu</option>
  </select>
  <button type="button" class="btn-primary" onclick="buatAkunBaru()">➕ Buat Akun</button>
  <div id="status" role="status"></div>
</section>

<section class="card">
  <p class="card-label">Daftar Akun</p>
  <div id="daftarAkunWrap"></div>
  <p class="empty-hint" id="akunEmpty" style="display:none;">Belum ada akun.</p>
</section>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="ic">🏠</span><span class="lbl">Menu</span></a>
  <a href="kasir.html"><span class="ic">💰</span><span class="lbl">Kasir</span></a>
  <a href="stok.html"><span class="ic">📦</span><span class="lbl">Stok</span></a>
  <a href="laporan.html"><span class="ic">📊</span><span class="lbl">Laporan</span></a>
</nav>

<script>
(function () {
  'use strict';

  // GANTI dengan URL Web App Anda (sama seperti di halaman lain).
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzbAp3WIwY2yu27Unbnh30nW802W1_BT-Ulmu8UIOEl2xmZP93_FF-Pj4GZS_8PKJX0Tw/exec';

  var LS_SESSION = 'bb_session_token';
  var LS_NAMA = 'bb_session_nama';
  var LS_ROLE = 'bb_session_role';
  var LS_USERNAME = 'bb_session_username';

  var elHeaderAvatar = document.getElementById('headerAvatar');
  var elHeaderNama = document.getElementById('headerNama');
  var elHeaderRole = document.getElementById('headerRole');
  var elStatus = document.getElementById('status');
  var elDaftarAkunWrap = document.getElementById('daftarAkunWrap');
  var elAkunEmpty = document.getElementById('akunEmpty');

  function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (err) { return ''; } }
  function safeRemove(key) { try { localStorage.removeItem(key); } catch (err) {} }
  function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function tampilkanStatus(pesan, tipe) { elStatus.className = tipe; elStatus.textContent = pesan; }

  function bersihkanSesi() {
    safeRemove(LS_SESSION); safeRemove(LS_NAMA); safeRemove(LS_ROLE); safeRemove(LS_USERNAME);
  }

  window.prosesLogout = function () {
    if (!confirm('Yakin mau logout?')) return;
    fetch(apiUrl('logout')).catch(function () {});
    bersihkanSesi();
    window.location.href = 'login.html';
  };

  function cekSesiExpired(res) {
    if (res && res.sessionExpired) {
      bersihkanSesi();
      window.location.href = 'login.html';
      return true;
    }
    return false;
  }

  function apiUrl(action, extraParams) {
    var qs = 'api=' + encodeURIComponent(action) + '&sessionToken=' + encodeURIComponent(safeGet(LS_SESSION));
    if (extraParams) Object.keys(extraParams).forEach(function (k) { qs += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(extraParams[k]); });
    return WEB_APP_URL + '?' + qs;
  }

  // ---------- Buat akun ----------

  window.buatAkunBaru = function () {
    var username = document.getElementById('newUsername').value.trim();
    var password = document.getElementById('newPassword').value;
    var nama = document.getElementById('newNama').value.trim();
    var role = document.getElementById('newRole').value;

    if (!username || !password || !nama) { tampilkanStatus('Username, password, dan nama wajib diisi.', 'error'); return; }

    fetch(apiUrl('buatakun', { username: username, password: password, nama: nama, role: role }))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (cekSesiExpired(res)) return;
        if (res && res.success) {
          tampilkanStatus('Akun "' + res.username + '" berhasil dibuat.', 'ok');
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('newNama').value = '';
          document.getElementById('newRole').value = 'Staf';
          muatDaftarAkun();
        } else {
          tampilkanStatus((res && res.message) || 'Gagal membuat akun.', 'error');
        }
      })
      .catch(function () { tampilkanStatus('Gagal terhubung ke Apps Script.', 'error'); });
  };

  // ---------- Daftar & kelola akun ----------

  function muatDaftarAkun() {
    fetch(apiUrl('daftarakun'))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (cekSesiExpired(res)) return;
        if (!res || !res.success) { tampilkanStatus((res && res.message) || 'Gagal memuat daftar akun.', 'error'); return; }
        renderDaftarAkun(res.akun || []);
      })
      .catch(function () { tampilkanStatus('Gagal terhubung ke Apps Script.', 'error'); });
  }

  function labelRoleBadge(role) {
    if (role === 'Admin') return 'badge-admin';
    if (role === 'Gudang') return 'badge-gudang';
    return 'badge-kasir';
  }

  function renderDaftarAkun(list) {
    elDaftarAkunWrap.innerHTML = '';
    if (list.length === 0) { elAkunEmpty.style.display = 'block'; return; }
    elAkunEmpty.style.display = 'none';

    list.forEach(function (a) {
      var div = document.createElement('div');
      div.className = 'akun-item';
      div.innerHTML =
        '<div class="baris-atas">' +
          '<div class="akun-avatar">' + escapeHtml((a.nama || '?').charAt(0).toUpperCase()) + '</div>' +
          '<div><div class="nama-baris">' + escapeHtml(a.nama) + '</div><div class="username-baris">@' + escapeHtml(a.username) + '</div></div>' +
          '<div class="badge-row">' +
            '<span class="badge ' + labelRoleBadge(a.role) + '">' + escapeHtml(a.role) + '</span>' +
            '<span class="badge ' + (a.status === 'Aktif' ? 'badge-aktif' : 'badge-nonaktif') + '">' + escapeHtml(a.status) + '</span>' +
          '</div>' +
        '</div>';

      var aksi = document.createElement('div');
      aksi.className = 'akun-aksi';

      var btnPw = document.createElement('button');
      btnPw.type = 'button'; btnPw.textContent = '🔑 Ganti Password';
      btnPw.addEventListener('click', function () { gantiPassword(a.username); });
      aksi.appendChild(btnPw);

      var selectRole = document.createElement('select');
      selectRole.className = 'role-select';
      selectRole.setAttribute('data-role-lama', a.role);
      ['Kasir', 'Gudang', 'Admin'].forEach(function (r) {
        var opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        if (r === a.role) opt.selected = true;
        selectRole.appendChild(opt);
      });
      selectRole.addEventListener('change', function () { ubahRole(a.username, selectRole.value, selectRole); });
      aksi.appendChild(selectRole);

      var btnStatus = document.createElement('button');
      btnStatus.type = 'button';
      btnStatus.className = a.status === 'Aktif' ? 'danger' : 'ok';
      btnStatus.textContent = a.status === 'Aktif' ? '⏸️ Nonaktifkan' : '▶️ Aktifkan';
      btnStatus.addEventListener('click', function () { ubahStatus(a.username, a.status === 'Aktif' ? 'Nonaktif' : 'Aktif'); });
      aksi.appendChild(btnStatus);

      div.appendChild(aksi);
      elDaftarAkunWrap.appendChild(div);
    });
  }

  function gantiPassword(username) {
    var passwordBaru = prompt('Password baru untuk @' + username + ' (minimal 6 karakter):');
    if (!passwordBaru) return;
    fetch(apiUrl('updateakun', { username: username, passwordBaru: passwordBaru }))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (cekSesiExpired(res)) return;
        if (res && res.success) { tampilkanStatus('Password @' + username + ' berhasil diganti.', 'ok'); }
        else { tampilkanStatus((res && res.message) || 'Gagal mengganti password.', 'error'); }
      })
      .catch(function () { tampilkanStatus('Gagal terhubung ke Apps Script.', 'error'); });
  }

  function ubahRole(username, roleBaru, selectEl) {
    var roleLama = selectEl.getAttribute('data-role-lama') || roleBaru;
    if (!confirm('Ubah role @' + username + ' jadi ' + roleBaru + '?')) {
      selectEl.value = roleLama;
      return;
    }
    selectEl.disabled = true;
    fetch(apiUrl('updateakun', { username: username, roleBaru: roleBaru }))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        selectEl.disabled = false;
        if (cekSesiExpired(res)) return;
        if (res && res.success) {
          tampilkanStatus('Role @' + username + ' diubah jadi ' + roleBaru + '.', 'ok');
          selectEl.setAttribute('data-role-lama', roleBaru);
          muatDaftarAkun();
        } else {
          tampilkanStatus((res && res.message) || 'Gagal mengubah role.', 'error');
          selectEl.value = roleLama;
        }
      })
      .catch(function () {
        selectEl.disabled = false;
        tampilkanStatus('Gagal terhubung ke Apps Script.', 'error');
        selectEl.value = roleLama;
      });
  }

  function ubahStatus(username, statusBaru) {
    var konfirmasi = statusBaru === 'Nonaktif'
      ? 'Nonaktifkan akun @' + username + '? Akun ini tidak akan bisa login lagi sampai diaktifkan ulang.'
      : 'Aktifkan lagi akun @' + username + '?';
    if (!confirm(konfirmasi)) return;
    fetch(apiUrl('updateakun', { username: username, statusBaru: statusBaru }))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (cekSesiExpired(res)) return;
        if (res && res.success) { tampilkanStatus('Status @' + username + ' diubah jadi ' + statusBaru + '.', 'ok'); muatDaftarAkun(); }
        else { tampilkanStatus((res && res.message) || 'Gagal mengubah status.', 'error'); }
      })
      .catch(function () { tampilkanStatus('Gagal terhubung ke Apps Script.', 'error'); });
  }

  // ---------- Init ----------

  var session = safeGet(LS_SESSION);
  if (!session) { window.location.href = 'login.html'; return; }

  var namaUser = safeGet(LS_NAMA) || '?';
  var roleUser = safeGet(LS_ROLE) || 'Staf';

  if (roleUser !== 'Admin') {
    alert('Halaman ini khusus untuk Admin.');
    window.location.href = 'index.html';
    return;
  }

  elHeaderAvatar.textContent = namaUser.charAt(0).toUpperCase();
  elHeaderNama.textContent = namaUser;
  elHeaderRole.textContent = roleUser;

  muatDaftarAkun();
})();
</script>
</body>
</html>
