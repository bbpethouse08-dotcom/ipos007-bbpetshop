<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B&B Petshop — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f3ee; --surface: #ffffff; --surface-sunken: #f0eee8;
    --ink: #201f1a; --ink-dim: #726d60; --line: #e4e0d5;
    --accent: #2c4bd4; --accent-ink: #ffffff; --accent-soft: #e8ecfc;
    --ok-ink: #1c6b3c; --ok-bg: #e3f3e6; --err-ink: #af2a1e; --err-bg: #fbe8e4;
    --focus-ring: #2c4bd4;
    --shadow: 0 1px 2px rgba(32,31,26,.04), 0 6px 20px rgba(32,31,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14140f; --surface: #1d1c17; --surface-sunken: #201f19;
      --ink: #f1efe6; --ink-dim: #9a9587; --line: #34322a;
      --accent: #7d93f0; --accent-ink: #12142a; --accent-soft: #232a4a;
      --ok-ink: #7fd39a; --ok-bg: #17301f; --err-ink: #f0958a; --err-bg: #3a1f1b;
      --focus-ring: #7d93f0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45; padding: 16px 14px 100px;
    max-width: 560px; margin-left: auto; margin-right: auto;
  }

  header.app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .header-user { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex: none;
  }
  .header-user .info { min-width: 0; }
  .header-user .info h1 { font-size: 15.5px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-pill {
    display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; margin-top: 3px;
  }
  .btn-logout {
    background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 10px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; padding: 0; flex: none;
  }

  .greeting { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .greeting-sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 18px; }

  .menu-grid { display: grid; gap: 12px; }
  .menu-card {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; box-shadow: var(--shadow); transition: transform .06s ease;
  }
  .menu-card:active { transform: scale(.98); }
  .menu-card .icon {
    font-size: 24px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); border-radius: 13px; flex: none;
  }
  .menu-card.admin .icon { background: var(--ok-bg); }
  .menu-card .txt h2 { font-size: 15px; margin: 0 0 3px; font-weight: 700; }
  .menu-card .txt p { font-size: 12.5px; color: var(--ink-dim); margin: 0; line-height: 1.4; }
  .menu-card .chevron { margin-left: auto; color: var(--ink-dim); font-size: 15px; flex: none; }

  .section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-dim); margin: 22px 0 10px;
  }

  nav.bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); display: flex;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 12px rgba(32,31,26,.06); z-index: 100;
  }
  nav.bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 2px; text-decoration: none; color: var(--ink-dim); border-radius: 10px;
  }
  nav.bottom-nav a .ic { font-size: 21px; }
  nav.bottom-nav a .lbl { font-size: 10px; font-weight: 600; }
  nav.bottom-nav a.active { color: var(--accent); }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-user">
    <div class="avatar" id="headerAvatar">?</div>
    <div class="info">
      <h1 id="headerNama">Memuat…</h1>
      <span class="role-pill" id="headerRole">-</span>
    </div>
  </div>
  <button type="button" class="btn-logout" onclick="prosesLogout()" title="Logout">🚪</button>
</header>

<p class="greeting" id="greetingText">Selamat datang 👋</p>
<p class="greeting-sub">Pilih menu untuk mulai kerja.</p>

<div class="menu-grid">
  <a class="menu-card" href="kasir.html">
    <div class="icon">💰</div>
    <div class="txt"><h2>Kasir</h2><p>Jual barang + scan barcode kamera</p></div>
    <span class="chevron">›</span>
  </a>
  <a class="menu-card" href="stok.html">
    <div class="icon">📦</div>
    <div class="txt"><h2>Stok</h2><p>Opname, Transfer, Pembelian, Harga</p></div>
    <span class="chevron">›</span>
  </a>
  <a class="menu-card" href="laporan.html">
    <div class="icon">📊</div>
    <div class="txt"><h2>Laporan</h2><p>Ringkasan & konfirmasi booking</p></div>
    <span class="chevron">›</span>
  </a>
</div>

<div id="adminSection" style="display:none;">
  <p class="section-label">Khusus Admin</p>
  <div class="menu-grid">
    <a class="menu-card admin" href="akun.html">
      <div class="icon">👤</div>
      <div class="txt"><h2>Kelola Akun</h2><p>Buat & atur akun login staf</p></div>
      <span class="chevron">›</span>
    </a>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="ic">🏠</span><span class="lbl">Menu</span></a>
  <a href="kasir.html"><span class="ic">💰</span><span class="lbl">Kasir</span></a>
  <a href="stok.html"><span class="ic">📦</span><span class="lbl">Stok</span></a>
  <a href="laporan.html"><span class="ic">📊</span><span class="lbl">Laporan</span></a>
</nav>

<script>
(function () {
  'use strict';

  // GANTI dengan URL Web App Anda (sama seperti di halaman lain).
  var WEB_APP_URL = 'GANTI_DENGAN_URL_WEB_APP_ANDA';

  var LS_SESSION = 'bb_session_token';
  var LS_NAMA = 'bb_session_nama';
  var LS_ROLE = 'bb_session_role';
  var LS_USERNAME = 'bb_session_username';

  function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (err) { return ''; } }
  function safeRemove(key) { try { localStorage.removeItem(key); } catch (err) {} }

  function apiUrl(action, extraParams) {
    var qs = 'api=' + encodeURIComponent(action) + '&sessionToken=' + encodeURIComponent(safeGet(LS_SESSION));
    if (extraParams) Object.keys(extraParams).forEach(function (k) { qs += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(extraParams[k]); });
    return WEB_APP_URL + '?' + qs;
  }

  function bersihkanSesi() {
    safeRemove(LS_SESSION); safeRemove(LS_NAMA); safeRemove(LS_ROLE); safeRemove(LS_USERNAME);
  }

  window.prosesLogout = function () {
    if (!confirm('Yakin mau logout?')) return;
    fetch(apiUrl('logout')).catch(function () {});
    bersihkanSesi();
    window.location.href = 'login.html';
  };

  // ---------- Init ----------

  var session = safeGet(LS_SESSION);
  if (!session) { window.location.href = 'login.html'; return; }

  var nama = safeGet(LS_NAMA) || '?';
  var role = safeGet(LS_ROLE) || 'Staf';
  document.getElementById('headerAvatar').textContent = nama.charAt(0).toUpperCase();
  document.getElementById('headerNama').textContent = nama;
  document.getElementById('headerRole').textContent = role;
  document.getElementById('greetingText').textContent = 'Halo, ' + nama + ' 👋';
  if (role === 'Admin') document.getElementById('adminSection').style.display = 'block';
})();
</script>
</body>
</html>
