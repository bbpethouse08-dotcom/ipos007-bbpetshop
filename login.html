<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — B&B Petshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f3ee; --surface: #ffffff; --surface-sunken: #f0eee8;
    --ink: #201f1a; --ink-dim: #726d60; --line: #e4e0d5;
    --accent: #2c4bd4; --accent-ink: #ffffff; --accent-soft: #e8ecfc;
    --err-ink: #af2a1e; --err-bg: #fbe8e4;
    --focus-ring: #2c4bd4;
    --shadow: 0 1px 2px rgba(32,31,26,.04), 0 6px 20px rgba(32,31,26,.06);
    --shadow-lg: 0 4px 8px rgba(32,31,26,.05), 0 16px 40px rgba(32,31,26,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14140f; --surface: #1d1c17; --surface-sunken: #201f19;
      --ink: #f1efe6; --ink-dim: #9a9587; --line: #34322a;
      --accent: #7d93f0; --accent-ink: #12142a; --accent-soft: #232a4a;
      --err-ink: #f0958a; --err-bg: #3a1f1b;
      --focus-ring: #7d93f0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg: 0 8px 16px rgba(0,0,0,.3), 0 24px 60px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 18px;
  }
  .login-wrap { width: 100%; max-width: 380px; }

  .brand { text-align: center; margin-bottom: 26px; }
  .brand .emoji { font-size: 42px; line-height: 1; margin-bottom: 8px; }
  .brand h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .brand p { font-size: 13px; color: var(--ink-dim); margin: 0; }

  .login-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 26px 22px; box-shadow: var(--shadow-lg);
  }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface-sunken); color: var(--ink);
  }
  input::placeholder { color: var(--ink-dim); opacity: .8; }
  input:focus, button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 46px; }
  .toggle-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-size: 17px; cursor: pointer; padding: 8px; width: auto;
  }

  button.btn-primary {
    font-family: inherit; font-size: 15px; font-weight: 700; padding: 14px; border: none;
    border-radius: 11px; cursor: pointer; width: 100%; background: var(--accent); color: var(--accent-ink);
    margin-top: 20px; transition: transform .06s ease, opacity .15s ease;
  }
  button.btn-primary:active { transform: scale(.98); }
  button.btn-primary:disabled { opacity: .55; cursor: default; }

  #status {
    margin-top: 14px; padding: 10px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
    display: none; background: var(--err-bg); color: var(--err-ink);
  }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--ink-dim); margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <div class="emoji">🐾</div>
    <h1>B&amp;B Petshop</h1>
    <p>Login untuk masuk ke sistem internal</p>
  </div>

  <div class="login-card">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="mis. indah" autocomplete="username" autocapitalize="off">

    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="toggle-eye" id="toggleEye" onclick="toggleLihatPassword()">👁️</button>
    </div>

    <button type="button" class="btn-primary" id="btnLogin" onclick="prosesLogin()">Masuk</button>
    <div id="status" role="status"></div>
  </div>

  <p class="footer-note">Lupa password? Minta Admin (Putu) untuk mengatur ulang lewat menu Kelola Akun.</p>
</div>

<script>
(function () {
  'use strict';

  // GANTI dengan URL Web App Anda (sama seperti di booking.html).
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyMdvK_g4VKPICPITZxn9b4vwEMm7pGPpmuswtpRHw4H4lEP-6wwBPga-ECg66dpVJvCw/exec';

  var LS_SESSION = 'bb_session_token';
  var LS_NAMA = 'bb_session_nama';
  var LS_ROLE = 'bb_session_role';
  var LS_USERNAME = 'bb_session_username';

  var elUsername = document.getElementById('username');
  var elPassword = document.getElementById('password');
  var elBtnLogin = document.getElementById('btnLogin');
  var elStatus = document.getElementById('status');

  function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (err) {} }
  function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (err) { return ''; } }

  function tampilkanError(pesan) {
    elStatus.style.display = 'block';
    elStatus.textContent = pesan;
  }

  window.toggleLihatPassword = function () {
    var isText = elPassword.type === 'text';
    elPassword.type = isText ? 'password' : 'text';
    document.getElementById('toggleEye').textContent = isText ? '👁️' : '🙈';
  };

  window.prosesLogin = function () {
    var username = elUsername.value.trim();
    var password = elPassword.value;
    elStatus.style.display = 'none';

    if (!username || !password) { tampilkanError('Username dan password wajib diisi.'); return; }

    elBtnLogin.disabled = true; elBtnLogin.textContent = 'Memeriksa...';

    var qs = 'api=login&username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
    fetch(WEB_APP_URL + '?' + qs)
      .then(function (res) { return res.json(); })
      .then(function (res) {
        elBtnLogin.disabled = false; elBtnLogin.textContent = 'Masuk';
        if (res && res.success) {
          safeSet(LS_SESSION, res.sessionToken);
          safeSet(LS_NAMA, res.nama);
          safeSet(LS_ROLE, res.role);
          safeSet(LS_USERNAME, username);
          window.location.href = 'index.html';
        } else {
          tampilkanError((res && res.message) || 'Login gagal. Cek username & password.');
        }
      })
      .catch(function () {
        elBtnLogin.disabled = false; elBtnLogin.textContent = 'Masuk';
        tampilkanError('Gagal terhubung ke server. Cek koneksi internet Anda.');
      });
  };

  elPassword.addEventListener('keydown', function (e) { if (e.key === 'Enter') prosesLogin(); });
  elUsername.addEventListener('keydown', function (e) { if (e.key === 'Enter') elPassword.focus(); });

  // Kalau sudah ada sesi tersimpan, langsung lempar ke Menu (tidak perlu
  // login ulang tiap buka halaman ini).
  if (safeGet(LS_SESSION)) window.location.href = 'index.html';
})();
</script>
</body>
</html>
